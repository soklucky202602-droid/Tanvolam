<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản Trị Võ Lâm H5 · ADMV</title><style>*{box-sizing:border-box}body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0d1411;color:#e9f4ee;max-width:1150px;margin:20px auto;padding:0 14px}h1,h2{color:#ffd24a;margin:0 0 12px}.card{background:#111e18;border:1px solid #2d4c3c;border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px #0006}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}input,select,button{font:inherit;padding:8px 10px;border-radius:6px}input,select{background:#080e0c;border:1px solid #365042;color:#fff}button{cursor:pointer}.pri{background:#277a48;border:1px solid #44e37a;color:#fff;font-weight:bold}.sub{background:#192d23;border:1px solid #365042;color:#ddd}.gold{background:#b88617;border:1px solid #ffd24a;color:#111;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.list{max-height:280px;overflow:auto;border:1px solid #2d4c3c;border-radius:7px}.list div{padding:9px;border-bottom:1px solid #20352b}.list div:hover{background:#193126}.msg{min-height:20px;color:#86efac;margin-top:8px}.small{font-size:12px;color:#9ab2a2}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><h1>⚔ Quản Trị Máy Chủ Võ Lâm H5 · ADMV</h1><div class="card"><div class="row"><b>🟢 Online: <span id="onlineCount">0</span></b><b>👥 Tài khoản: <span id="totalUsers">0</span></b><button id="btnReload" class="sub">🔄 Làm mới</button><a href="/play01" target="_blank" class="sub">🎮 Vào game test</a></div><div id="startupMsg" class="msg"></div></div><section class="card"><h2>👥 Người chơi</h2><div class="row"><input id="userSearch" placeholder="Tài khoản / tên nhân vật"><button id="searchUsers" class="pri">Tìm</button></div><div id="users" class="list" style="margin-top:10px"></div><div id="filteredCount" class="small"></div></section><section class="card"><h2>🎁 Phát trực tiếp</h2><div id="grantTarget" class="msg">Chọn tài khoản ở danh sách trên.</div><div class="grid"><label>Cấp<input id="levelInput" type="number" min="1" max="180"></label><label>Vạn<input id="grantVanInput" type="number" min="0" value="0"></label><label>KNB<input id="grantKnbInput" type="number" min="0" value="0"></label></div><div class="row" style="margin-top:10px"><input id="grantItemId" placeholder="ID vật phẩm"><input id="grantItemName" placeholder="Tên vật phẩm"><input id="grantItemQty" type="number" min="1" value="1"><button id="grantDirect" class="pri">Cộng / phát</button></div><div id="grantBasicStatus" class="msg"></div></section><section class="card"><h2>🖥 Server</h2><div class="grid"><label>EXP<input id="setExp" type="number" step="0.1" value="1"></label><label>Vàng<input id="setGold" type="number" step="0.1" value="1"></label><label>Drop<input id="setDrop" type="number" step="0.1" value="1"></label></div><div class="row" style="margin-top:10px"><button id="saveServer" class="pri">Lưu cấu hình</button><button id="openServer" class="sub">Mở server</button><button id="maintenance" class="sub">Bảo trì</button></div><div id="serverMsg" class="msg"></div></section><section class="card"><h2>🎫 Gift Code</h2><div class="row"><input id="giftCode" placeholder="Mã code"><input id="giftUses" type="number" min="1" value="100"><input id="giftKnb" type="number" min="0" value="0"><button id="createGift" class="pri">Tạo code</button></div><div id="giftMsg" class="msg"></div><div id="giftList" class="list" style="margin-top:10px"></div></section><section class="card"><h2>🏆 Ranking</h2><button id="loadRanking" class="pri">Tải ranking</button><div id="rankingList" class="list" style="margin-top:10px"></div></section><script src="js/admin-admv-bridge.js?v=1"></script><script src="js/admin-admv.js?v=3"></script><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const api=(u,o={})=>fetch(u,{credentials:'include',headers:{'content-type':'application/json'},...o}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||('HTTP '+r.status));return j});let users=[],sel=null;async function load(){try{const m=await api('/api/auth/me');if(m.user?.role!=='admin')throw Error('Tài khoản không có quyền admin');try{const d=await api('/api/admin/users');users=d.users||[];$('onlineCount').textContent=d.onlineCount??0;$('totalUsers').textContent=d.total??users.length;render();$('startupMsg').textContent='';return}catch(primary){const d=await api('/api/admin/admv/players');const map=new Map();for(const p of d.players||[]){if(!map.has(p.owner))map.set(p.owner,{id:p.owner,username:p.username,charName:p.name,activeSlot:(Number(p.slot)||1)-1,isOnline:false,lvl:p.lvl,stage:p.stage});}users=[...map.values()];$('onlineCount').textContent='—';$('totalUsers').textContent=users.length;render();$('startupMsg').textContent='Đã chuyển sang danh sách ADMV trực tiếp.'}}catch(e){$('startupMsg').textContent=e.message;$('startupMsg').style.color='#fca5a5'}}function render(){const q=($('userSearch').value||'').trim().toLowerCase();const f=users.filter(u=>!q||String(u.username||'').toLowerCase().includes(q)||String(u.charName||'').toLowerCase().includes(q));$('users').innerHTML=f.map(u=>{const i=users.indexOf(u);return `<div><b>${esc(u.username)}</b> · ${u.isOnline?'🟢 Online':'⚪ Offline'} · ${esc(u.charName||'Chưa tạo')} <button class="sub" style="float:right" onclick="window.pickAdmin(${i})">Chọn</button></div>`}).join('')||'<div>Không tìm thấy.</div>';$('filteredCount').textContent=`Hiển thị ${f.length}/${users.length}`}window.pickAdmin=i=>{sel=users[i];$('grantTarget').textContent=`Đang chọn: ${sel.username} · ${sel.charName||'Chưa tạo'} · Slot ${(sel.activeSlot??0)+1}`};$('searchUsers').onclick=render;$('btnReload').onclick=load;$('grantDirect').onclick=async()=>{if(!sel)return alert('Hãy chọn tài khoản trước');try{const b={target:sel.id,slot:(sel.activeSlot??0)+1,level:Number($('levelInput').value)||null,gold:(Number($('grantVanInput').value)||0)*10000,knb:Number($('grantKnbInput').value)||0,items:$('grantItemId').value?[{id:$('grantItemId').value,n:$('grantItemName').value||$('grantItemId').value,qty:Number($('grantItemQty').value)||1}]:[]};await api('/api/admin/grant',{method:'POST',body:JSON.stringify(b)});$('grantBasicStatus').textContent='✔ Đã phát thành công.';await load()}catch(e){$('grantBasicStatus').textContent=e.message}};$('saveServer').onclick=async()=>{try{await api('/api/admin/admv/settings',{method:'PUT',body:JSON.stringify({settings:{xp:Number($('setExp').value)||1,gold:Number($('setGold').value)||1,drop:Number($('setDrop').value)||1}})});$('serverMsg').textContent='✔ Đã lưu.'}catch(e){$('serverMsg').textContent=e.message}};$('openServer').onclick=async()=>{try{await api('/api/admin/server-open',{method:'POST',body:JSON.stringify({open:true})});$('serverMsg').textContent='✔ Đã mở server.'}catch(e){$('serverMsg').textContent=e.message}};$('maintenance').onclick=async()=>{try{const d=await api('/api/admin/maintenance');await api('/api/admin/maintenance',{method:'POST',body:JSON.stringify({enabled:!d.enabled})});$('serverMsg').textContent='✔ Đã đổi trạng thái bảo trì.'}catch(e){$('serverMsg').textContent=e.message}};$('createGift').onclick=async()=>{try{const d=await api('/api/admin/gift-codes',{method:'POST',body:JSON.stringify({code:$('giftCode').value.trim(),maxUses:Number($('giftUses').value)||100,knb:Number($('giftKnb').value)||0})});$('giftMsg').textContent='✔ Đã tạo '+(d.code||'giftcode');loadCodes()}catch(e){$('giftMsg').textContent=e.message}};async function loadCodes(){try{const d=await api('/api/admin/gift-codes');$('giftList').innerHTML=(d.codes||[]).map(c=>`<div><b>${esc(c.code)}</b> · dùng ${c.used||0}/${c.maxUses||0}</div>`).join('')||'Chưa có code.'}catch(e){$('giftList').textContent=e.message}}$('loadRanking').onclick=async()=>{try{const d=await api('/api/admin/ranking');$('rankingList').innerHTML=(d.ranking||[]).map((x,i)=>`<div>#${i+1} <b>${esc(x.name||x.username)}</b> · Lv.${x.lvl||1} · Ải ${x.stage||1}</div>`).join('')||'Chưa có ranking.'}catch(e){$('rankingList').textContent=e.message}}load().then(loadCodes).catch(e=>{$('startupMsg').textContent=e.message;$('startupMsg').style.color='#fca5a5'});</script></body></html>
