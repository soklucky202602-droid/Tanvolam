<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1412">
<meta name="game-version" content="20261010-v11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Võ Lâm H5">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="description" content="Trải nghiệm Võ Lâm H5, game kiếm hiệp nhàn rỗi với 10 đại môn phái, luyện kỹ năng, săn trang bị và khám phá giang hồ. Chơi ngay trên trình duyệt!">
<meta name="robots" content="index,follow">
<link rel="icon" href="/assets/favicon.igMJ8Bkn.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.CHN0dhhp.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.DBgiGrDq.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.B9t_rA5F.png">
<link rel="preload" as="image" href="/assets/st_0.Cvy0aYvo.webp">
<link rel="preload" as="image" href="/assets/st_1.eyNLLve3.webp">
<link rel="manifest" href="/assets/manifest.CTPvahEo.json">
<title>Võ Lâm H5 · Server 01 – Kiếm Hiệp Nhàn Rỗi</title>
<link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill.P2Xu9kJm.js">
<link rel="stylesheet" crossorigin href="/assets/game.DI5dJOGr.css">
<link rel="stylesheet" href="online.css?v=20261010-gift-v1">
<script src="/js/api-config.js?v=20261013-api-v1"></script>
</head>
<body>
<div id="app">
  <header id="top">
      <div class="hero-mark">
        <div class="lvbox"><canvas id="heroAvatar" width="92" height="92" aria-hidden="true"></canvas></div>
        <span class="hero-level" aria-label="Cấp nhân vật"><span>Cấp</span><b id="topLevel">1</b></span>
      </div>
      <div class="topmid">
        <div class="row">
          <span class="hero-identity"><b id="heroName">Võ Lâm H5</b></span>
          <span id="stageLbl"></span>
          <span class="top-power" aria-label="Lực Chiến"><span>Lực Chiến</span><b id="topPowerValue">0</b></span>
        </div>
        <div id="hud" class="status-frame">
          <div class="bar xp"><i id="xpBar"></i><span class="bar-label">EXP</span><span id="xpTxt"></span></div>
          <div class="bar hp"><i id="hpBar"></i><span class="bar-label">HP</span><span id="hpTxt"></span></div>
          <div class="bar mp"><i id="mpBar"></i><span class="bar-label">MP</span><span id="mpTxt"></span></div>
        </div>
      </div>
    <div class="top-wallet-col">
      <button id="serverRankBtn" class="top-rank-btn" type="button" title="Bảng Xếp Hạng Server">🏆 HẠNG</button>
      <div class="gold" id="topWallet">
        <div class="wallet-row silver-row" title="Ngân lượng (Tiền vạn)">
          <img class="coin silver-coin" src="/assets/silverbao.png?v=20261009-v1" alt="Bạc" aria-hidden="true">
          <span id="gold">0</span>
        </div>
        <div class="wallet-row knb-row" id="topKnbRow" title="Kim Nguyên Bảo (Mở Kỳ Trân Các)" style="cursor: pointer;">
          <img class="coin gold-coin" src="/img/ep/knb.png?v=20261009-v1" alt="KNB" aria-hidden="true">
          <span id="knbVal">0</span>
          <span class="knb-unit">KNB</span>
        </div>
      </div>
    </div>
    <button id="giftBtn" title="Phần thưởng">🎁</button>
    <button id="compactBtn" title="Thu gọn / mở rộng sân đấu">⛶</button>
  </header>

  <section id="battle">
    <div id="bg"></div>
    <canvas id="arena"></canvas>
    <div id="miniFloat" aria-label="Bản đồ phóng to"><canvas id="miniCanvas"></canvas></div>
    <div id="mainSk"></div>
    <div id="townBar" class="hidden"><b id="townName"></b><button class="btn sm" id="bShop">Cửa hàng</button><button class="btn sm" id="bStashT">Kho chung</button><button class="btn sm" id="bSellTown">Bán đồ</button><button class="btn sm on" id="bBack">Trở lại ải</button></div>
    <div id="autoControls" role="group" aria-label="Điều khiển tự động">
      <button id="appUpdateBtn" class="app-update hidden" type="button" aria-label="Có phiên bản mới. Cập nhật ngay" title="Có phiên bản mới">Cập nhật ngay</button>
      <button id="giftcodeBtn" type="button" aria-label="Nhập Giftcode" title="Nhập Giftcode (Nhận Tiên Thảo Lộ, KNB & Quà)" onclick="if(typeof openGiftcodeModal==='function')openGiftcodeModal();">
        <img src="/assets/gift.svg?v=1" alt="Giftcode" aria-hidden="true">
      </button>
      <button id="autoSettingsBtn" type="button" aria-label="Cài đặt Auto" title="Cài đặt Auto">
        <img src="/assets/wrench.-jci5Xax.svg?v=20261004-v164" alt="" aria-hidden="true">
      </button>
      <button id="ctrlBtn" class="chip autotoggle" role="switch" aria-label="Auto" aria-checked="true"
        title="Bật: tự đánh và đi nhặt đồ khớp bộ lọc. Ngừng điều khiển tay thì Auto tiếp tục. Tắt: bấm ô kỹ năng để đánh thủ công. Phím F bật/tắt Auto.">
        <span>Auto</span><span class="ios-switch" aria-hidden="true"><i></i></span>
      </button>
    </div>
    <button id="inBtn" class="chip"></button>
    <aside id="worldChat" aria-label="Chat thế giới">
      <section class="wc-panel" aria-label="Chat thế giới" hidden>
        <header class="wc-topline">
          <nav class="wc-tabs" aria-label="Các tab chat">
            <button class="wc-tab active" type="button" data-chat-tab="world" aria-pressed="true">Thế giới</button>
            <button class="wc-tab" type="button" data-chat-tab="system" aria-pressed="false">Nhật ký</button>
            <button class="wc-tab wc-zalo" type="button" aria-label="Mở nhóm Zalo" title="Tham gia nhóm Zalo">Zalo</button>
          </nav>
          <div class="wc-header-right">
            <small class="wc-online">Online 0</small>
            <span class="wc-status" role="status" aria-live="polite" hidden></span>
            <button class="wc-maximize" type="button" aria-expanded="false" aria-label="Phóng to khung chat" title="Phóng to khung chat">⛶</button>
          </div>
        </header>
        <div class="wc-list" role="log" aria-label="Tin nhắn chat thế giới" aria-live="polite" aria-relevant="additions"></div>
        <div class="wc-system-list" aria-label="Nhật ký hệ thống" hidden></div>
        <form class="wc-form">
          <div class="wc-compose">
            <button class="wc-emoji-toggle" type="button" aria-label="Mở bảng biểu cảm" aria-expanded="false">☺</button>
            <input class="wc-input" type="text" maxlength="240" autocomplete="off" placeholder="Nhập tin nhắn…" aria-label="Tin nhắn">
            <button class="wc-send" type="submit">Gửi</button>
          </div>
        </form>
        <div class="wc-emoji-picker" role="dialog" aria-label="Biểu cảm" hidden>
          <div class="wc-emoji-toolbar"><span>Biểu cảm</span><button class="wc-emoji-close" type="button" aria-label="Đóng bảng biểu cảm">✕</button></div>
          <div class="wc-emoji-grid" role="grid" aria-label="Chọn biểu cảm"></div>
        </div>
      </section>
      <button class="wc-toggle" type="button" aria-expanded="false" aria-label="Mở chat thế giới" title="Chat thế giới">💬<span class="wc-unread" hidden></span></button>
    </aside>
    <div id="svHud" class="hidden">
      <div id="svTopBar">
        <span id="svGoldWrap">💰 <b id="svGold">0</b></span>
        <button id="svPauseBtn" class="chip">⏸</button>
      </div>
      <div id="svPad">
        <button id="svUlt" class="pbtn ult"><div class="cd"></div><span class="lbl">Tuyệt kỹ</span><small class="lock"></small></button>
        <button id="svBomb" class="pbtn bomb" aria-label="Bom"><img class="bomb-icon" src="/assets/bomb-training.BYbM0sEv.png" alt="" draggable="false"><span class="bomb-count" id="svBombCnt">0</span></button>
        <button id="svHpBtn" class="pbtn pot hp"><img class="potion-icon" src="/assets/pot0.i-vwuqcO.png" alt="" draggable="false"><div class="cd"></div><span>HP</span></button>
      </div>
    </div>
    <div id="svBar" class="hidden"></div>
    <div id="pad">
      <button class="pbtn sk" data-i="0"><i></i><b>1</b></button>
      <button class="pbtn sk" data-i="1"><i></i><b>2</b></button>
      <button class="pbtn sk" data-i="2"><i></i><b>3</b></button>
      <button class="pbtn sk" data-i="3"><i></i><b>4</b></button>
      <button class="pbtn pot hp" id="bHp"><img class="potion-icon" alt="" draggable="false"><div class="cd"></div><b class="potion-count" hidden></b><span>HP</span></button>
      <button class="pbtn pot mp" id="bMp"><img class="potion-icon" alt="" draggable="false"><div class="cd"></div><b class="potion-count" hidden></b><span>MP</span></button>
      <button class="pbtn ride" id="bRide" type="button" aria-label="Lên hoặc xuống ngựa" title="Lên hoặc xuống ngựa"><img src="/assets/horse-saddle.CwEIIXVK.png?v=20261007-v2" alt="" draggable="false"></button>
      <button class="pbtn pot tp" id="bTp"><div class="cd"></div><span>Về<br>thành</span></button>
    </div>
  </section>

  <main id="panel">
    <div class="tab" id="t-log"></div>
    <div class="tab hidden" id="t-char"></div>
    <div class="tab hidden" id="t-skill"></div>
    <div class="tab hidden" id="t-inv"></div>
    <div class="tab hidden" id="t-auto"></div>
    <div class="tab hidden" id="t-more"></div>
  </main>

  <nav id="tabs">
    <button data-t="log" class="on" title="Giang hồ (H)" aria-keyshortcuts="H">Giang hồ</button>
    <button data-t="char">Nhân vật<em class="dot" id="dotChar"></em></button>
    <button data-t="skill">Võ công<em class="dot" id="dotSkill"></em></button>
    <button data-t="inv">Hành trang</button>
    <button data-t="more" title="Treo máy (B)" aria-keyshortcuts="B">Treo máy</button>
  </nav>

  <div id="modal" class="hidden" role="dialog" aria-modal="true"><div class="mbox" tabindex="-1"><button class="mx" id="mClose">✕</button><div id="mBody"></div></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(async function() {
  try {
    const r = await fetch('/api/public/simbot-status', { cache: 'no-store' });
    const j = await r.json();
    if (j && typeof j.enabled === 'boolean') {
      window.SIMBOT_ENABLED = j.enabled;
      if (!j.enabled) window.NO_SIMBOT = true;
    }
  } catch(e) {}
})();
</script>
<script src="/js/doll-data.js?v=20261010-v10"></script>
<script src="/js/simbot-train.js?v=20261010-v5"></script>
<script src="/js/ky-tran-cac.js?v=20261009-ktc-v1"></script>
<script src="/js/auth.js"></script>
<script src="/js/server-ranking.js?v=20261009-rank-v2"></script>
<script src="/js/online-presence.js?v=20261010-v5"></script>
<script src="/js/chat-bubble.js?v=20261010-v1"></script>
<script src="/js/server-open-guard.js?v=20261010-v1"></script>
<script src="/js/giftcode-modal.js?v=20261010-v1"></script>
<script type="module">
(async()=>{
  try{
    await window.jxAuthReady;
    const m=await import('/assets/game.zBuLCNB4.js?v=20261010-v11');
    if(m&&typeof m.boot==='function')m.boot();
    else if(m&&typeof m.default==='function')m.default();
  }catch(e){
    console.error(e);
    const el=document.querySelector('#toast');
    if(el)el.textContent='Không thể khởi động trò chơi. Vui lòng tải lại trang.';
  }
})();
</script>
</body>
</html>
