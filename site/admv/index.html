<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMV · Võ Lâm H5</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09070d;color:#eee7ff;font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1280px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.title{font-size:25px;font-weight:900;color:#d8b4fe}.sub{color:#9f91b7;font-size:12px}.card{background:#120d1b;border:1px solid #3a2855;border-radius:12px;padding:15px;margin-bottom:14px;box-shadow:0 8px 28px #0007}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tabs button{background:#1b1430;border:1px solid #4c3a78;color:#ddd6fe;border-radius:7px;padding:9px 13px;font-weight:800}.tabs button.on{background:#6d28d9;border-color:#a78bfa;color:#fff}.pane{display:none}.pane.on{display:block}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.input,input,select,textarea{width:100%;background:#08060c;border:1px solid #4c3a78;color:#fff;border-radius:7px;padding:9px}.btn{background:#6d28d9;border:1px solid #a78bfa;color:#fff;border-radius:7px;padding:9px 13px;font-weight:800}.btn2{background:#211936;border:1px solid #4c3a78;color:#ddd6fe;border-radius:7px;padding:9px 13px;font-weight:700}.danger{color:#fca5a5}.ok{color:#86efac}.target{background:#25153d;border:1px solid #7c3aed;padding:10px;border-radius:8px;margin:10px 0;color:#ddd6fe}.list{max-height:300px;overflow:auto;border:1px solid #302344;border-radius:8px}.item{padding:10px;border-bottom:1px solid #211932;cursor:pointer}.item:hover,.item.sel{background:#25153d}.action{display:grid;grid-template-columns:1.7fr 1fr auto;gap:8px;align-items:center;background:#0d0913;border:1px solid #2f2448;border-radius:8px;padding:10px;margin:7px 0}.action b{color:#eadcff}.setting{background:#0d0913;border:1px solid #2f2448;border-radius:8px;padding:10px}.setting label{display:block;color:#c4b5fd;font-size:12px;margin-bottom:6px}.checks{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0}.login{max-width:430px;margin:12vh auto}.login h1{text-align:center}.hide{display:none!important}.msg{min-height:22px;margin-top:8px}.log{max-height:320px;overflow:auto;font-size:12px}.log div{padding:8px;border-bottom:1px solid #211932}@media(max-width:800px){.grid,.action{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}

/* ADMV layout repair: prevent settings cards from forcing the page wider than the viewport. */
html,body{width:100%;max-width:100%;min-width:0;overflow-x:hidden}
.wrap{width:100%;max-width:1120px;min-width:0;margin-inline:auto;padding:clamp(10px,2.2vw,22px)}
#app,.card,.pane,#settings{width:100%;max-width:100%;min-width:0}
.grid{width:100%;max-width:100%;min-width:0;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:12px}
.setting{min-width:0;width:100%;display:flex;flex-direction:column;justify-content:space-between;gap:10px;padding:13px}
.setting label{min-width:0;min-height:2.4em;line-height:1.35;font-size:13px;overflow-wrap:anywhere}
.setting select{display:block;width:100%;max-width:100%;min-width:0;height:42px;padding:8px 10px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px;margin:14px 0}
.checks label{display:flex;align-items:center;gap:9px;min-width:0;margin:0;padding:10px 12px;background:#0d0913;border:1px solid #302344;border-radius:8px;line-height:1.4}
.checks input[type="checkbox"]{appearance:auto;width:17px!important;height:17px;min-width:17px;flex:0 0 17px;margin:0;accent-color:#7c3aed}
#settings .btn,#settings .btn2{min-height:40px;white-space:normal;margin:3px 6px 3px 0}
#settings .msg{min-height:0;line-height:1.5;overflow-wrap:anywhere}
#settings .msg:not(:empty){margin-top:10px;padding:10px 12px;border:1px solid #3a2855;border-radius:8px;background:#0d0913}
@media(max-width:620px){.wrap{padding:10px}.card{padding:12px}.grid{grid-template-columns:minmax(0,1fr)}.checks{grid-template-columns:minmax(0,1fr)}.tabs{gap:6px}.tabs button{padding:8px 10px}.top{align-items:flex-start;flex-direction:column}}

</style>
<script src="/js/api-config.js?v=20261013-admvpage"></script>
</head>
<body>
<div id="login" class="login card">
<h1>⚙ ADMV · GM CONTROL</h1><p class="sub">Trang quản trị riêng. Chỉ tài khoản admin mới được sử dụng.</p>
<label>Tài khoản<input id="lu" autocomplete="username"></label><br><label>Mật khẩu<input id="lp" type="password" autocomplete="current-password"></label><br>
<button class="btn" id="loginBtn" style="width:100%">Đăng nhập</button><div id="loginMsg" class="msg danger"></div>
</div>
<div id="app" class="wrap hide">
<div class="top"><div><div class="title">⚔ ADMV · GM CONTROL</div><div class="sub">Điều khiển nhân vật theo cơ chế queue → game client → engine.</div></div><div class="row" style="max-width:340px"><span id="who" class="sub"></span><button class="btn2" id="logout">Đăng xuất</button></div></div>
<div class="card"><div class="tabs" id="tabs"><button class="on" data-tab="players">👤 Nhân vật</button><button data-tab="hero">⚔ Nhân vật</button><button data-tab="world">🌍 Thế giới</button><button data-tab="item">🎒 Đồ</button><button data-tab="act">🏯 Hoạt động</button><button data-tab="settings">⚙ Hệ số</button><button data-tab="announce">📣 Thông báo</button><button data-tab="audit">📜 Nhật ký</button></div>
<div id="players" class="pane on"></div><div id="hero" class="pane"></div><div id="world" class="pane"></div><div id="item" class="pane"></div><div id="act" class="pane"></div><div id="settings" class="pane"></div><div id="announce" class="pane"></div><div id="audit" class="pane"></div>
</div></div>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(u,o={})=>{const r=await fetch(u,{credentials:'include',headers:{'content-type':'application/json',...(o.headers||{})},...o});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||('HTTP '+r.status));return j};
let players=[],sel=null,settings={};
const actions={hero:[['Đặt cấp',['10','30','50','80','100','120','150','MAX_LEVEL'],p=>({level:p})],['Cộng điểm tiềm năng',['10','50','200'],p=>({potential:p})],['Cộng điểm võ công',['5','20','100'],p=>({martial:p})],['Ngân lượng',['1000000','10000000','100000000','1000000000'],p=>({gold:p})],['Hồi đầy máu và nội lực',null,()=>({fullHp:true,fullMp:true})]],world:[['Nhảy tới ải',['1','10','20','40','60','80','100','STAGES'],p=>({kind:'stage',stage:p})],['Tới đợt trùm của ải',null,()=>({kind:'bossWave'})],['Gọi trùm vùng',null,()=>({kind:'regionalBoss'})],['Gọi Trùm Hoàng Kim',null,()=>({kind:'goldenBoss'})],['Gọi tinh anh',['5','10','20'],p=>({kind:'elite',count:p})],['Xóa hết quái trên sân',null,()=>({kind:'clearEnemies'})],['Mở toàn bộ vùng',null,()=>({kind:'unlockWorld'})]],item:[['Phát 10 món đồ ngẫu nhiên',['3','4','5','6'],p=>({action:'random',count:p})],['Một bộ Hoàng Kim đủ ô',null,()=>({action:'goldenSet'})],['Cường hóa +10 đồ đang mặc',null,()=>({action:'upgrade10'})],['Nguyên liệu đầy đủ',null,()=>({action:'materials',qty:100})]],act:[['Đặt lại lượt công thành, Tống Kim, tháp',null,()=>({action:'reset'})],['Đặt kỷ lục tháp',['0','10','25','49','50','100'],p=>({action:'towerRecord',value:p})],['Lệnh công thành',['100','500','2000'],p=>({action:'ct',value:p})],['Tống Kim Lệnh',['100','500','2000'],p=>({action:'tk',value:p})],['Phúc Duyên',['50','200','1000'],p=>({action:'phucDuyen',value:p})],['Buff EXP +25% (phút)',['30','60','180'],p=>({action:'expBuff',minutes:p})],['Làm xong nhiệm vụ ngày',null,()=>({action:'daily'})],['Mở lại điểm danh',null,()=>({action:'attendance'})],['Mở khóa tính năng',null,()=>({action:'unlock'})]]};
function tab(name){document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id===name));document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.tab===name));if(name==='players')loadPlayers();if(name==='settings')loadSettings();if(name==='audit')loadAudit()}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
async function boot(){try{const m=await api('/api/auth/me');if(m.user?.role!=='admin')throw Error('Tài khoản này không có quyền admin.');show(m.user)}catch(e){$('login').classList.remove('hide');$('app').classList.add('hide');$('loginMsg').textContent=e.message}}
function show(u){$('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent='GM: '+u.username;renderAll();loadPlayers();loadSettings()}
$('loginBtn').onclick=async()=>{try{const u=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:$('lu').value,password:$('lp').value})});if(u.user?.username)show(u.user);else throw Error('Đăng nhập thất bại')}catch(e){$('loginMsg').textContent=e.message}};
$('lp').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};$('logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'}).catch(()=>{});location.reload()};
function renderAll(){renderPlayers();renderActions('hero');renderActions('world');renderActions('item');renderActions('act');renderSettings();renderAnnounce();}
function renderPlayers(){ $('players').innerHTML=`<div class="row"><input id="q" placeholder="Tên nhân vật hoặc tài khoản"><button class="btn" id="search">🔎 Tìm</button><button class="btn2" id="refresh">🔄</button></div><div id="selected" class="target">Chưa chọn nhân vật.</div><div id="plist" class="list"></div><div id="pmsg" class="msg"></div>`;$('search').onclick=loadPlayers;$('refresh').onclick=loadPlayers;$('q').onkeydown=e=>{if(e.key==='Enter')loadPlayers()}}
async function loadPlayers(){try{const q=$('q')?.value||'';const d=await api('/api/admin/admv/players?q='+encodeURIComponent(q));players=d.players||[];const list=$('plist');if(!list)return;list.innerHTML=players.map((p,i)=>`<div class="item ${sel===p?'sel':''}" data-i="${i}"><b>${esc(p.name||'Chưa đặt tên')}</b> · ${esc(p.username)} · Slot ${p.slot} · Lv.${p.lvl} · Ải ${p.stage}</div>`).join('')||'<div class="item">Không có nhân vật.</div>';list.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{sel=players[+x.dataset.i];$('selected').innerHTML=`Đang chọn: <b>${esc(sel.name)}</b> · ${esc(sel.username)} · Slot ${sel.slot} · Lv.${sel.lvl} · Ải ${sel.stage}`;loadPlayers()})}catch(e){if($('pmsg'))$('pmsg').textContent=e.message}}
function need(){if(!sel){alert('Hãy chọn nhân vật trong tab 👤 trước.');return false}return true}
function renderActions(group){const e=$(group);e.innerHTML=`<div class="target">${group==='hero'?'Điều khiển nhân vật':group==='world'?'Điều khiển thế giới':group==='item'?'Phát đồ / vật phẩm':'Điều khiển hoạt động'}</div>`+actions[group].map((a,i)=>`<div class="action"><b>${esc(a[0])}</b>${a[1]?`<select id="${group}-${i}">${a[1].map(v=>`<option value="${v}">${v==='MAX_LEVEL'?'Cấp tối đa':v==='STAGES'?'Ải cuối':v}</option>`).join('')}</select>`:'<span class="sub">Không cần giá trị</span>'}<button class="btn" data-run="${i}">Thực hiện</button></div>`).join('')+`<div id="${group}Msg" class="msg"></div>`;e.querySelectorAll('[data-run]').forEach(b=>b.onclick=async()=>{if(!need())return;const i=+b.dataset.run,a=actions[group][i],el=a[1]&&$(`${group}-${i}`),v=el?.value;const payload=a[2](v==='MAX_LEVEL'||v==='STAGES'?v:Number(v));b.disabled=true;try{const d=await api('/api/admin/admv/action',{method:'POST',body:JSON.stringify({owner:sel.owner,slot:sel.slot,action:group,payload})});$(group+'Msg').textContent='✔ '+(d.message||'Đã xếp lệnh cho '+sel.name);loadPlayers()}catch(e){$(group+'Msg').textContent=e.message;$(group+'Msg').className='msg danger'}finally{b.disabled=false}})}
const setRows=[['xp','EXP nhận được',[.5,1,2,3,5,10,25,100]],['gold','Vàng rơi',[.5,1,2,5,10,50]],['drop','Tỉ lệ rơi đồ',[.5,1,2,3,5,10]],['hp','Máu quái',[.1,.25,.5,1,2,5,10]],['dmg','Sát thương quái',[0,.25,.5,1,2,5]],['heroDmg','Sát thương của bạn',[.5,1,2,5,10,100,1000000]],['spawn','Số quái mỗi đợt',[.5,1,2,3,5]],['lucky','May mắn cộng thêm',[0,10,25,50,100,200]],['speed','Tốc độ game',[0,.5,1,1.5,2.5,5,10]]];
function renderSettings(){$('settings').innerHTML=`<div class="grid">${setRows.map(x=>`<div class="setting"><label>${x[1]}</label><select data-sk="${x[0]}">${x[2].map(v=>`<option value="${v}">${x[0]==='lucky'?'+':''}${v}</option>`).join('')}</select></div>`).join('')}</div><div class="checks"><label><input type="checkbox" data-sf="god"> Bất tử</label><label><input type="checkbox" data-sf="infMana"> Nội lực vô hạn</label><label><input type="checkbox" data-sf="maintenance"> Bảo trì</label></div><button class="btn" id="saveSet">💾 Lưu hệ số</button> <button class="btn2" id="resetSet">Mặc định</button><div id="setMsg" class="msg"></div>`;$('saveSet').onclick=saveSettings;$('resetSet').onclick=()=>{settings={xp:1,gold:1,drop:1,hp:1,dmg:1,heroDmg:1,spawn:1,lucky:0,speed:0,god:false,infMana:false,maintenance:false};fillSettings()};fillSettings()}
function fillSettings(){document.querySelectorAll('[data-sk]').forEach(x=>x.value=settings[x.dataset.sk]??1);document.querySelectorAll('[data-sf]').forEach(x=>x.checked=!!settings[x.dataset.sf])}
async function loadSettings(){try{settings={...(await api('/api/admin/admv/settings'))};fillSettings()}catch(e){}}
async function saveSettings(){const out={};document.querySelectorAll('[data-sk]').forEach(x=>out[x.dataset.sk]=Number(x.value));document.querySelectorAll('[data-sf]').forEach(x=>out[x.dataset.sf]=x.checked);try{settings=await api('/api/admin/admv/settings',{method:'PUT',body:JSON.stringify({settings:out})});fillSettings();$('setMsg').textContent='✔ Đã lưu.'}catch(e){$('setMsg').textContent=e.message}}
function renderAnnounce(){$('announce').innerHTML=`<textarea id="announceText" rows="5" placeholder="Thông báo toàn server..."></textarea><br><button class="btn" id="announceBtn">📣 Gửi thông báo</button><div id="annMsg" class="msg"></div>`;$('announceBtn').onclick=async()=>{try{const text=$('announceText').value.trim();await api('/api/admin/admv/announce',{method:'POST',body:JSON.stringify({text})});$('annMsg').textContent='✔ Đã lưu thông báo.'}catch(e){$('annMsg').textContent=e.message}}}
async function loadAudit(){try{const d=await api('/api/admin/admv/audit');$('audit').innerHTML='<div class="log">'+(d.items||[]).map(x=>`<div><b>${esc(x.admin)}</b> · ${new Date(x.at).toLocaleString()} · ${esc(x.action)} · ${esc(x.target)}<br><span class="sub">${esc(x.detail)}</span></div>`).join('')+'</div>'}catch(e){$('audit').textContent=e.message}}
boot();
</script>
</body></html>
