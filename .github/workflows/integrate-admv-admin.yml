name: Integrate ADMV admin controls
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire ADMV frontend and backend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changed=False
          p=Path('site/admin.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="js/admin-admv.js?v=1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
              changed=True
          p=Path('backend/admin-server.js')
          s=p.read_text(encoding='utf-8')
          req="require('./admin-admv.js');"
          if req not in s:
              marker="require('./admin-fix.js');"
              if marker not in s:
                  raise SystemExit('admin-fix require not found')
              s=s.replace(marker,marker+'\n'+req,1)
              p.write_text(s,encoding='utf-8')
              changed=True
          print('changed' if changed else 'already integrated')
          PY
          node --check backend/admin-admv.js
          node --check backend/admin-server.js
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/admin.html backend/admin-server.js
          git diff --cached --quiet && exit 0
          git commit -m "Integrate ADMV into admin panel"
          git push
